<app-header></app-header>

<div class="register-container">
  <div class="auth-form-container">
    <h2>Sign Up</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input 
          type="text" 
          id="name" 
          formControlName="name" 
          class="form-control"
          [ngClass]="{'is-invalid': registerForm.get('name')?.touched && registerForm.get('name')?.invalid}"
        >
        <div *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.errors?.['required']" class="error-message">
          Name is required
        </div>
      </div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          class="form-control"
          [ngClass]="{'is-invalid': registerForm.get('email')?.touched && registerForm.get('email')?.invalid}"
        >
        <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.errors?.['required']" class="error-message">
          Email is required
        </div>
        <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.errors?.['email']" class="error-message">
          Please enter a valid email
        </div>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          class="form-control"
          [ngClass]="{'is-invalid': registerForm.get('password')?.touched && registerForm.get('password')?.invalid}"
        >
        <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors?.['required']" class="error-message">
          Password is required
        </div>
        <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors?.['minlength']" class="error-message">
          Password must be at least 6 characters
        </div>
      </div>
      
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          formControlName="confirmPassword" 
          class="form-control"
          [ngClass]="{'is-invalid': registerForm.get('confirmPassword')?.touched && registerForm.get('confirmPassword')?.invalid}"
        >
        <div *ngIf="registerForm.get('confirmPassword')?.touched && registerForm.get('confirmPassword')?.errors?.['required']" class="error-message">
          Please confirm your password
        </div>
        <div *ngIf="registerForm.get('confirmPassword')?.touched && registerForm.get('confirmPassword')?.errors?.['notMatch']" class="error-message">
          Passwords do not match
        </div>
      </div>
      
      <div class="form-group">
        <label>Register as:</label>
        <div class="radio-options">
          <div class="radio-option">
            <input type="radio" id="user" formControlName="role" value="user">
            <label for="user">Participant</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="admin" formControlName="role" value="admin">
            <label for="admin">Admin</label>
          </div>
        </div>
      </div>
      
      <div *ngIf="errorMessage" class="error-message alert">
        {{ errorMessage }}
      </div>
      
      <button 
        type="submit" 
        class="btn-primary" 
        [disabled]="registerForm.invalid || loading"
      >
        {{ loading ? 'Creating account...' : 'Sign Up' }}
      </button>
      
      <div class="auth-links">
        <p>Already have an account? <a routerLink="/auth/login">Login</a></p>
      </div>
    </form>
  </div>
</div>

<app-footer></app-footer>
