<app-header></app-header>

<div class="login-container">
  <div class="auth-form-container">
    <h2>Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          class="form-control"
          [ngClass]="{'is-invalid': loginForm.get('email')?.touched && loginForm.get('email')?.invalid}"
        >
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']" class="error-message">
          Email is required
        </div>
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']" class="error-message">
          Please enter a valid email
        </div>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          class="form-control"
          [ngClass]="{'is-invalid': loginForm.get('password')?.touched && loginForm.get('password')?.invalid}"
        >
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error-message">
          Password is required
        </div>
      </div>
      
      <div class="form-group">
        <label>Login as:</label>
        <div class="radio-options">
          <div class="radio-option">
            <input type="radio" id="user" formControlName="role" value="user">
            <label for="user">Participant</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="admin" formControlName="role" value="admin">
            <label for="admin">Admin</label>
          </div>
        </div>
      </div>
      
      <div *ngIf="errorMessage" class="error-message alert">
        {{ errorMessage }}
      </div>
      
      <button 
        type="submit" 
        class="btn-primary" 
        [disabled]="loginForm.invalid || loading"
      >
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
      
      <div class="auth-links">
        <p>Don't have an account? <a routerLink="/auth/register">Sign Up</a></p>
      </div>
    </form>
  </div>
</div>

<app-footer></app-footer>
