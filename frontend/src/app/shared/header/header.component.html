<nav class="header">
  <div class="logo">
    <a routerLink="/">
      <img src="assets/images/logo.png" alt="TechFest Logo" *ngIf="false">
      <h1>TechFest</h1>
    </a>
  </div>
  <div class="nav-links">
    <a routerLink="/" class="nav-button" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <i class="fas fa-home"></i> Home
    </a>
    
    <!-- Hide feedback form link for admin users -->
    <a routerLink="/feedback" class="nav-button" routerLinkActive="active" *ngIf="!isAdmin()">
      <i class="fas fa-clipboard-list"></i> Fill Feedback
    </a>
    
    <!-- Admin links -->
    <ng-container *ngIf="currentUser && isAdmin()">
      <a routerLink="/dashboard" class="nav-button" routerLinkActive="active">
        <i class="fas fa-chart-bar"></i> Dashboard
      </a>
    </ng-container>
    
    <!-- Authentication links -->
    <ng-container *ngIf="!currentUser">
      <a routerLink="/auth/login" class="nav-button login-btn">
        <i class="fas fa-sign-in-alt"></i> Login
      </a>
      <a routerLink="/auth/register" class="nav-button signup-btn">
        <i class="fas fa-user-plus"></i> Sign Up
      </a>
    </ng-container>
    
    <!-- User profile & logout -->
    <ng-container *ngIf="currentUser">
      <div class="user-menu">
        <span class="username">
          <i class="fas fa-user-circle"></i> {{ currentUser.name }}
          <span *ngIf="isAdmin()" class="admin-badge">Admin</span>
        </span>
        <a (click)="logout()" class="nav-button logout-btn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </a>
      </div>
    </ng-container>
  </div>
</nav>
